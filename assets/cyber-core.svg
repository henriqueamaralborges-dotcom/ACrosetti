<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Gradients -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D2FF00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D2FF00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyberPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A20"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2FF00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D2FF00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D2FF00" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2E2E38"/>
    </pattern>
  </defs>

  <!-- Ambient Glow -->
  <rect width="800" height="600" fill="#0A0A0C"/>
  <rect width="800" height="600" fill="url(#dotGrid)" opacity="0.65"/>
  <circle cx="400" cy="300" r="320" fill="url(#neonGlow)"/>
  <circle cx="480" cy="260" r="220" fill="url(#cyanGlow)"/>

  <!-- High-Tech Geometric Chassis Outer Octagon -->
  <polygon points="400,60 620,150 690,370 560,530 240,530 110,370 180,150" fill="none" stroke="#2B2B33" stroke-width="1.5" stroke-dasharray="10 6"/>
  <polygon points="400,85 595,165 655,360 540,505 260,505 145,360 205,165" fill="none" stroke="#D2FF00" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Telemetry Coordinate Grid Circles -->
  <circle cx="400" cy="300" r="240" stroke="#1F1F26" stroke-width="2"/>
  <circle cx="400" cy="300" r="180" stroke="#2A2A35" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="400" cy="300" r="130" stroke="#D2FF00" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="180 30 60 20"/>
  <circle cx="400" cy="300" r="90" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="70 20 120 15"/>

  <!-- Central Futuristic Mechatronics Visor / Core -->
  <g transform="translate(400, 300)">
    <!-- Carbon Shield Body -->
    <polygon points="-110,-45 110,-45 140,25 90,85 -90,85 -140,25" fill="url(#cyberPlate)" stroke="#D2FF00" stroke-width="2"/>
    
    <!-- Neon Visor Glass -->
    <polygon points="-95,-30 95,-30 120,20 75,70 -75,70 -120,20" fill="#131418" stroke="#00F0FF" stroke-width="1.5"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#D2FF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="-70" y1="25" x2="70" y2="25" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neural Network AI Node Array -->
    <circle cx="-50" cy="-10" r="4" fill="#D2FF00"/>
    <circle cx="0" cy="-15" r="5" fill="#FFFFFF"/>
    <circle cx="50" cy="-10" r="4" fill="#D2FF00"/>
    <line x1="-50" y1="-10" x2="0" y2="-15" stroke="#D2FF00" stroke-width="1.5"/>
    <line x1="0" y1="-15" x2="50" y2="-10" stroke="#D2FF00" stroke-width="1.5"/>

    <!-- Mechatronic Servo Mounts -->
    <rect x="-148" y="10" width="16" height="30" rx="3" fill="#25252D" stroke="#D2FF00" stroke-width="1"/>
    <rect x="132" y="10" width="16" height="30" rx="3" fill="#25252D" stroke="#D2FF00" stroke-width="1"/>
    
    <!-- Core Status Monospace Text -->
    <text x="0" y="52" fill="#D2FF00" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="3">AI CORE // SYS_OK</text>
  </g>

  <!-- High-Tech HUD Overlays and Data Readings -->
  <!-- Top Left Telemetry -->
  <g transform="translate(60, 80)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#D2FF00" stroke-width="2"/>
    <polygon points="0,0 20,20 180,20 160,0" fill="#D2FF00" fill-opacity="0.1"/>
    <text x="10" y="14" fill="#FFFFFF" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" letter-spacing="1.5">SPEC // MECATRONICS</text>
    <text x="0" y="38" fill="#8E8E9F" font-family="'Space Grotesk', monospace" font-size="9" letter-spacing="1">LATENCY: 0.12ms | REVISION: 2026.1</text>
    <text x="0" y="52" fill="#8E8E9F" font-family="'Space Grotesk', monospace" font-size="9" letter-spacing="1">SENSORS: DUAL LIDAR + CAMERA VISION</text>
  </g>

  <!-- Top Right Telemetry -->
  <g transform="translate(560, 80)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#00F0FF" stroke-width="2"/>
    <text x="180" y="14" fill="#00F0FF" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1.5">NEURAL NET ENGINE</text>
    <text x="180" y="38" fill="#8E8E9F" font-family="'Space Grotesk', monospace" font-size="9" text-anchor="end" letter-spacing="1">MODEL: VISION_TRANSFORMER_V4</text>
    <text x="180" y="52" fill="#D2FF00" font-family="'Space Grotesk', monospace" font-size="9" text-anchor="end" letter-spacing="1">AUTONOMOUS PROTOCOL: ACTIVE</text>
  </g>

  <!-- Bottom Left Badge -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="170" height="50" rx="4" fill="#141418" stroke="#2E2E38" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#D2FF00"/>
    <text x="14" y="20" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800">GLOBAL GAME JAM</text>
    <text x="14" y="38" fill="#D2FF00" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700">FINALISTA NEXT // 2026</text>
  </g>

  <!-- Bottom Right Badge -->
  <g transform="translate(570, 480)">
    <rect x="0" y="0" width="170" height="50" rx="4" fill="#141418" stroke="#2E2E38" stroke-width="1"/>
    <rect x="166" y="0" width="4" height="50" rx="2" fill="#00F0FF"/>
    <text x="156" y="20" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" text-anchor="end">LOKAR AUDIOVISUAL</text>
    <text x="156" y="38" fill="#00F0FF" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" text-anchor="end">PATROCÍNIO & ATUAÇÃO</text>
  </g>

  <!-- Target crosshairs -->
  <circle cx="400" cy="300" r="6" fill="#D2FF00"/>
  <line x1="390" y1="300" x2="410" y2="300" stroke="#D2FF00" stroke-width="2"/>
  <line x1="400" y1="290" x2="400" y2="310" stroke="#D2FF00" stroke-width="2"/>
</svg>