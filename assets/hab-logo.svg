    <rect x="0" y="0" width="60" height="20" rx="3" fill="#D2FF00" fill-opacity="0.1" stroke="#D2FF00" stroke-width="1"/>
    <text x="30" y="14" font-family="'Space Grotesk', 'Courier New', monospace" font-size="10" font-weight="800" fill="#D2FF00" text-anchor="middle" letter-spacing="1.5">HAB // 01</text>
